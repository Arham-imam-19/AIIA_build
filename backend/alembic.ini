# Alembic configuration.
#
# Alembic is the schema-migration tool for SQLAlchemy: it keeps an ordered list
# of scripts that build the database up step by step, and records which ones have
# already run. Think of it as version control for table structure - you never
# hand-edit a live database, you add a migration.
#
# The database URL is deliberately NOT set here. env.py reads it from the
# DATABASE_URL environment variable via app.config, so there is exactly one place
# that decides which database we talk to.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, readable filenames for new migrations.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
